[package]
name = "rusted"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "RustEd"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3.7", default-features = false }
serde_json = { version = "1.0", features = ["raw_value"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2.4"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
